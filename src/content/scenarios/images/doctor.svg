<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="Legekontor">
  <!-- Bakgrunn og gulv -->
  <rect width="400" height="300" fill="var(--surface-2)" />
  <rect y="230" width="400" height="70" fill="var(--line)" />

  <!-- Medisinskap på veggen med rødt kors -->
  <rect x="35" y="40" width="55" height="70" rx="3" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="2" />
  <!-- Rødt kors -->
  <rect x="58" y="60" width="9" height="30" rx="1.5" fill="var(--error)" />
  <rect x="47" y="70" width="31" height="9" rx="1.5" fill="var(--error)" />

  <!-- Helseplakat på veggen -->
  <rect x="130" y="35" width="60" height="80" rx="3" fill="var(--surface)" stroke="var(--primary)" stroke-width="2" />
  <rect x="138" y="45" width="44" height="20" fill="var(--primary-soft)" />
  <line x1="138" y1="75" x2="182" y2="75" stroke="var(--line-strong)" stroke-width="2" />
  <line x1="138" y1="85" x2="175" y2="85" stroke="var(--line-strong)" stroke-width="2" />
  <line x1="138" y1="95" x2="165" y2="95" stroke="var(--line-strong)" stroke-width="2" />

  <!-- Håndsprit-dispenser ved døren -->
  <rect x="345" y="110" width="16" height="35" rx="3" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5" />
  <rect x="350" y="103" width="6" height="7" fill="var(--primary)" />

  <!-- Undersøkelsesbenk / legebrisk -->
  <rect x="25" y="165" width="155" height="25" rx="4" fill="var(--primary)" />
  <!-- Pute på benken -->
  <rect x="30" y="160" width="35" height="12" rx="4" fill="var(--surface)" stroke="var(--primary)" stroke-width="1" />
  <!-- Benkbein -->
  <rect x="38" y="190" width="8" height="50" fill="var(--line-strong)" />
  <rect x="158" y="190" width="8" height="50" fill="var(--line-strong)" />
  <line x1="38" y1="215" x2="166" y2="215" stroke="var(--line-strong)" stroke-width="3" />

  <!-- Legebord -->
  <rect x="220" y="155" width="140" height="15" rx="3" fill="var(--surface)" stroke="var(--ink)" stroke-width="2" />
  <rect x="235" y="170" width="10" height="70" fill="var(--ink)" />
  <rect x="335" y="170" width="10" height="70" fill="var(--ink)" />

  <!-- Stetoskop på bordet -->
  <path d="M 245 152 Q 255 142 265 152 Q 275 160 285 150" fill="none" stroke="var(--error)" stroke-width="2" />
  <circle cx="288" cy="150" r="4" fill="var(--line-strong)" stroke="var(--ink)" stroke-width="1" />

  <!-- Pasientstol -->
  <rect x="200" y="175" width="30" height="30" rx="3" fill="var(--primary-soft)" stroke="var(--primary)" stroke-width="2" />
  <line x1="200" y1="175" x2="200" y2="140" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" />
  <line x1="205" y1="205" x2="205" y2="240" stroke="var(--ink)" stroke-width="2.5" />
  <line x1="225" y1="205" x2="225" y2="240" stroke="var(--ink)" stroke-width="2.5" />
</svg>
