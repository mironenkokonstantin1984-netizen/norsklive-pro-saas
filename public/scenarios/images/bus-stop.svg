<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="Bussholdeplass">
  <!-- Himmel og gate -->
  <rect width="400" height="300" fill="var(--surface-2)" />
  <rect y="190" width="400" height="40" fill="var(--line-strong)" />
  <!-- Asfaltert vei nederst -->
  <rect y="230" width="400" height="70" fill="var(--ink)" />
  <!-- Hvit veistripe -->
  <line x1="20" y1="265" x2="80" y2="265" stroke="var(--surface)" stroke-width="4" stroke-dasharray="15,10" />
  <line x1="120" y1="265" x2="380" y2="265" stroke="var(--surface)" stroke-width="4" stroke-dasharray="15,10" />

  <!-- Buss som ankommer i bakgrunnen -->
  <rect x="290" y="145" width="95" height="55" rx="6" fill="var(--error)" />
  <rect x="295" y="152" width="22" height="18" rx="2" fill="var(--primary-soft)" />
  <rect x="323" y="152" width="22" height="18" rx="2" fill="var(--primary-soft)" />
  <rect x="351" y="152" width="26" height="18" rx="2" fill="var(--primary-soft)" />
  <!-- Busshjul -->
  <circle cx="310" cy="202" r="8" fill="var(--ink)" />
  <circle cx="365" cy="202" r="8" fill="var(--ink)" />

  <!-- Lyktestolpe -->
  <line x1="30" y1="40" x2="30" y2="210" stroke="var(--ink)" stroke-width="4" />
  <path d="M 30 50 Q 30 30 50 30 L 60 30" fill="none" stroke="var(--ink)" stroke-width="4" />
  <ellipse cx="60" cy="35" rx="10" ry="4" fill="var(--hint-soft)" />

  <!-- Bussskilt med buss-symbol -->
  <line x1="110" y1="65" x2="110" y2="205" stroke="var(--ink)" stroke-width="3" />
  <circle cx="110" cy="65" r="18" fill="var(--primary)" stroke="var(--surface)" stroke-width="2" />
  <!-- Liten bussikon på skiltet -->
  <rect x="101" y="58" width="18" height="12" rx="2" fill="var(--surface)" />
  <circle cx="104" cy="72" r="2" fill="var(--surface)" />
  <circle cx="116" cy="72" r="2" fill="var(--surface)" />

  <!-- Leskur (glass og ramme) -->
  <rect x="145" y="85" width="130" height="115" rx="4" fill="var(--primary-soft)" opacity="0.45" stroke="var(--primary)" stroke-width="3" />
  <!-- Tak på leskuret -->
  <rect x="135" y="75" width="150" height="12" rx="3" fill="var(--primary)" />
  <!-- Støttestolper -->
  <line x1="150" y1="87" x2="150" y2="205" stroke="var(--primary)" stroke-width="3" />
  <line x1="270" y1="87" x2="270" y2="205" stroke="var(--primary)" stroke-width="3" />

  <!-- Rutetabell opphengt i leskuret -->
  <rect x="160" y="105" width="28" height="42" rx="2" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5" />
  <line x1="164" y1="115" x2="184" y2="115" stroke="var(--line-strong)" stroke-width="1.5" />
  <line x1="164" y1="125" x2="184" y2="125" stroke="var(--line-strong)" stroke-width="1.5" />
  <line x1="164" y1="135" x2="178" y2="135" stroke="var(--line-strong)" stroke-width="1.5" />

  <!-- Trebenk inne i leskuret -->
  <rect x="195" y="150" width="65" height="8" rx="2" fill="var(--hint)" />
  <line x1="205" y1="158" x2="205" y2="205" stroke="var(--ink)" stroke-width="3" />
  <line x1="250" y1="158" x2="250" y2="205" stroke="var(--ink)" stroke-width="3" />

  <!-- Søppelkasse montert på stolpe -->
  <rect x="98" y="130" width="14" height="22" rx="2" fill="var(--line-strong)" stroke="var(--ink)" stroke-width="1.5" />
</svg>
