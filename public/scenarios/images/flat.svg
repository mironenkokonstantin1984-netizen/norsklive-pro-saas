<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="Stue og leilighet">
  <!-- Bakgrunn og gulv -->
  <rect width="400" height="300" fill="var(--surface-2)" />
  <rect y="220" width="400" height="80" fill="var(--line)" />

  <!-- Dør på bakveggen -->
  <rect x="25" y="60" width="55" height="160" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="2" rx="2" />
  <circle cx="70" cy="145" r="3" fill="var(--ink)" />

  <!-- Bilde på veggen -->
  <rect x="150" y="40" width="80" height="55" rx="3" fill="var(--surface)" stroke="var(--primary)" stroke-width="3" />
  <circle cx="175" cy="62" r="10" fill="var(--hint-soft)" />
  <polygon points="160,85 190,65 220,85" fill="var(--primary-soft)" />

  <!-- Bokhylle med bøker -->
  <rect x="315" y="45" width="65" height="175" fill="var(--surface)" stroke="var(--ink)" stroke-width="2" rx="2" />
  <!-- Hylleplater -->
  <line x1="315" y1="90" x2="380" y2="90" stroke="var(--ink)" stroke-width="2" />
  <line x1="315" y1="135" x2="380" y2="135" stroke="var(--ink)" stroke-width="2" />
  <line x1="315" y1="180" x2="380" y2="180" stroke="var(--ink)" stroke-width="2" />
  <!-- Bøker -->
  <rect x="322" y="58" width="10" height="32" fill="var(--primary)" />
  <rect x="334" y="62" width="12" height="28" fill="var(--hint)" />
  <rect x="348" y="55" width="14" height="35" fill="var(--success)" />
  <rect x="325" y="102" width="12" height="33" fill="var(--error)" />
  <rect x="339" y="105" width="10" height="30" fill="var(--primary)" />
  <rect x="323" y="148" width="15" height="32" fill="var(--hint)" />

  <!-- Gulvteppe -->
  <ellipse cx="205" cy="255" rx="95" ry="30" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="2" />

  <!-- Sofa -->
  <rect x="115" y="145" width="180" height="55" rx="8" fill="var(--primary)" />
  <!-- Sofarygg -->
  <rect x="110" y="125" width="190" height="35" rx="8" fill="var(--primary-hover)" />
  <!-- Armlener -->
  <rect x="100" y="140" width="22" height="50" rx="6" fill="var(--primary-hover)" />
  <rect x="288" y="140" width="22" height="50" rx="6" fill="var(--primary-hover)" />
  <!-- Sofaputer -->
  <rect x="130" y="145" width="35" height="30" rx="5" fill="var(--hint-soft)" />
  <rect x="245" y="145" width="35" height="30" rx="5" fill="var(--hint-soft)" />
  <!-- Sofaben -->
  <rect x="125" y="198" width="8" height="15" fill="var(--ink)" />
  <rect x="277" y="198" width="8" height="15" fill="var(--ink)" />

  <!-- Sofabord med vase -->
  <ellipse cx="205" cy="235" rx="45" ry="14" fill="var(--surface)" stroke="var(--ink)" stroke-width="2" />
  <line x1="185" y1="245" x2="185" y2="260" stroke="var(--ink)" stroke-width="3" />
  <line x1="225" y1="245" x2="225" y2="260" stroke="var(--ink)" stroke-width="3" />
  <!-- Liten vase med blomst -->
  <rect x="200" y="218" width="10" height="14" rx="2" fill="var(--primary-soft)" stroke="var(--primary)" stroke-width="1.5" />
  <circle cx="205" cy="212" r="5" fill="var(--error)" />

  <!-- Stålampe -->
  <line x1="92" y1="85" x2="92" y2="245" stroke="var(--ink)" stroke-width="3" />
  <polygon points="75,85 110,85 102,60 82,60" fill="var(--hint-soft)" stroke="var(--ink)" stroke-width="1.5" />
  <ellipse cx="92" cy="245" rx="15" ry="5" fill="var(--ink)" />
</svg>
